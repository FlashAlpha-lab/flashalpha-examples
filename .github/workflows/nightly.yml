name: Nightly

# Catches drift that PR-time CI misses:
#   - link-check job: always runs, no secrets needed. HEAD-checks every CTA
#     URL in every recipe. Catches marketing-site changes (e.g. the /signup
#     404 surfaced during Phase 0.5 hardening).
#   - live-smoke job: runs only when FLASHALPHA_API_KEY is configured as a
#     repo secret. Re-executes every recipe against the live API. Catches
#     API drift, SDK regressions, and stale recipe code.
#
# To enable live-smoke: add FLASHALPHA_API_KEY as a repo secret at
# https://github.com/FlashAlpha-lab/flashalpha-examples/settings/secrets/actions

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: python -m pip install -e ".[dev]"

      - name: Layer 1 link liveness (no auth required)
        run: |
          # Force-skip the 7-day cache so this nightly always hits the network.
          rm -rf .cache
          pytest tests/test_links_alive.py -v

  live-smoke:
    runs-on: ubuntu-latest
    # Note: GitHub Actions forbids `secrets.X` in job-level `if:` expressions
    # (https://docs.github.com/en/actions/security-guides/encrypted-secrets).
    # The job runs unconditionally; each heavy step is gated on a step-level
    # output that reads the secret from `env:`.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check if FLASHALPHA_API_KEY is configured
        id: check_secret
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
        run: |
          if [ -n "$FLASHALPHA_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "FLASHALPHA_API_KEY is configured — running live smoke"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "FLASHALPHA_API_KEY not configured — skipping live smoke. Set the secret at /settings/secrets/actions to enable."
          fi

      - name: Install dev deps + ipykernel
        if: steps.check_secret.outputs.available == 'true'
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install ipykernel
          python -m ipykernel install --user --name python3

      - name: Re-execute every recipe against live API
        if: steps.check_secret.outputs.available == 'true'
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
        run: |
          set -e
          for nb in notebooks/tier-*/[0-9]*.ipynb; do
            if [ -f "$nb" ]; then
              echo "::group::papermill $nb"
              python -m papermill "$nb" /tmp/out.ipynb --kernel python3
              echo "::endgroup::"
            fi
          done

      - name: Scrub auth headers (defensive)
        if: steps.check_secret.outputs.available == 'true'
        run: |
          for nb in notebooks/tier-*/[0-9]*.ipynb; do
            if [ -f "$nb" ]; then
              python -m scripts.scrub_outputs "$nb" || true
            fi
          done

      - name: Open drift PR if anything changed
        if: steps.check_secret.outputs.available == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "nightly: refresh recipe outputs from live API"
          title: "Nightly drift: recipe outputs changed against live API"
          body: |
            Automated nightly re-execution detected changes in one or more
            recipe outputs. Review the diff — could be a stale `last_validated_live`
            timestamp (benign), an API field rename (action required), or
            real market-data drift (benign for non-deterministic recipes).
          branch: nightly/drift
          delete-branch: true
